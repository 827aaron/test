[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.1.0"
description = "AI 交易系统：机器学习信号 + 风险管理 + 回测 + 模拟交易"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-trader = "ai_trader.cli:main"

[tool.setuptools]
packages = ["ai_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

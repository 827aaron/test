[project]
name = "aiquant"
version = "0.1.0"
description = "个人 AI 多智能体量化交易系统（币安 U 本位合约 + Solana Meme 交易台）"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "keyring>=25",
    "cryptography>=43",
    "python-telegram-bot>=22",
    "numpy>=2",
]

[project.optional-dependencies]
nautilus = ["nautilus-trader>=1.231"]
ccxt = ["ccxt>=4.5"]

[project.scripts]
aiquant = "engine.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
ignore = ["B008"]
